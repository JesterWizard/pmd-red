<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Editor</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdad4;
  --accent: #2f6fd6; --accent-ink: #ffffff; --warn-bg: #fff4d6; --warn: #8a5a00; --err-bg: #fde4e1; --err: #a1271b;
  --ok-bg: #e2f4e6; --ok: #1f6b33; --row-hover: #f0f3fa; --comment: #5c7a46; --code: #f2f1ed;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18191b; --panel: #222326; --ink: #ececee; --muted: #a0a0a8; --line: #3a3b40;
    --accent: #6c9eff; --accent-ink: #0b1020; --warn-bg: #3d3115; --warn: #f0c56a; --err-bg: #3e1d1a; --err: #ff9d91;
    --ok-bg: #18331f; --ok: #8fdca2; --row-hover: #2b2e36; --comment: #9bc27f; --code: #2a2b2f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
nav button { border: 0; background: none; padding: 8px 12px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
nav button.on { color: var(--ink); border-bottom-color: var(--accent); }
#status { margin-left: auto; font-size: 13px; padding: 4px 10px; border-radius: 6px; max-width: 60%; }
#status.ok { background: var(--ok-bg); color: var(--ok); }
#status.err { background: var(--err-bg); color: var(--err); }
main { padding: 16px; }
.tab { display: none; }
.tab.on { display: block; }
button.b, label.b { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.b.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.b:disabled { opacity: .5; cursor: default; }
button.i { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 5px; font-size: 13px; border-radius: 4px; }
button.i:hover { background: var(--row-hover); color: var(--ink); }
input, select, textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
textarea { width: 100%; }
.mono, textarea.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: calc(100vh - 120px); overflow: auto; position: sticky; top: 64px; }
.side .hd { color: var(--muted); font-size: 12px; padding: 8px 6px 2px; }
.side .it { padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.side .it:hover { background: var(--row-hover); }
.side .it.on { background: var(--accent); color: var(--accent-ink); }
.side .it small { display: block; opacity: .75; font-size: 11.5px; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar .sp { flex: 1; }
.rows { width: 100%; }
.row { display: grid; grid-template-columns: 24px 54px minmax(180px, 230px) 1fr minmax(120px, 240px) 64px; gap: 6px; align-items: start; padding: 4px 4px; border-bottom: 1px solid var(--line); }
.row:hover { background: var(--row-hover); }
.row .n { color: var(--muted); font-size: 11px; padding-top: 5px; text-align: right; }
.row .args { display: flex; flex-wrap: wrap; gap: 6px; }
.row .arg { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); }
.row .arg.wide { flex: 1 1 100%; }
.row .arg input { width: 150px; }
.row > div > select { width: 100%; }
.row .arg.wide textarea { min-height: 2.4em; }
.row .help { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.row .help { display: none; }
.row:hover .help, .row:focus-within .help { display: block; }
.row.comment .c { grid-column: 3 / 6; }
.row.comment input { width: 100%; color: var(--comment); font-style: italic; }
.row.blank { min-height: 14px; }
.row.blank .c { grid-column: 3 / 6; color: var(--muted); font-size: 11px; }
.row .cm input { width: 100%; color: var(--comment); }
.thumb { width: 120px; border-radius: 4px; border: 1px solid var(--line); display: block; margin-top: 3px; image-rendering: pixelated; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.err { background: var(--err-bg); color: var(--err); border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 13px; white-space: pre-wrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.card img.pic { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 4px; image-rendering: pixelated; background: #000; }
.card img.tall { width: 100%; max-height: 360px; object-fit: contain; border-radius: 4px; background: #000; }
.card h3 { margin: 0; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.card h3 small { color: var(--muted); font-weight: normal; }
.kv { display: grid; grid-template-columns: minmax(70px, auto) 1fr; gap: 4px 8px; align-items: center; font-size: 13px; }
.kv input[type=text], .kv input:not([type]), .kv select { width: 100%; }
.uses { font-size: 12px; color: var(--muted); }
.uses div { display: flex; gap: 6px; align-items: center; margin-top: 3px; }
.uses input { width: 70px; }
.uses span { white-space: nowrap; }
h2 { font-size: 15px; margin: 18px 0 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.t input.num { width: 70px; }
table.t input.view { width: 100%; min-width: 220px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); }
.muted { color: var(--muted); }
pre.log { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; max-height: 60vh; font-size: 12px; }
.fieldrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.fieldrow label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; }
.fieldrow input { width: 120px; }
</style>
</head>
<body>
<header>
  <h1>Event Editor</h1>
  <nav>
    <button data-tab="scenes" class="on">Scenes</button>
    <button data-tab="cgs">Story CGs</button>
    <button data-tab="opening">Opening</button>
    <button data-tab="build">Build</button>
  </nav>
  <div id="status"></div>
</header>
<main>
  <section id="tab-scenes" class="tab on">
    <div class="layout">
      <div class="side" id="scene-side"></div>
      <div class="pane" id="scene-pane"></div>
    </div>
  </section>
  <section id="tab-cgs" class="tab"></section>
  <section id="tab-opening" class="tab"></section>
  <section id="tab-build" class="tab">
    <div class="pane">
      <p>Builds <code>pmd_red.gba</code> with <code>make</code> (the sky story). The editor's files are read by the build:
      nothing else to do. The ROM is in the repository's top folder.</p>
      <button class="b primary" id="build-btn">Build the ROM</button>
      <pre class="log" id="build-log" hidden></pre>
    </div>
  </section>
</main>
<datalist id="dl-none"></datalist>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
function status(msg, ok = true) {
  const s = $("#status");
  s.textContent = msg; s.className = msg ? (ok ? "ok" : "err") : "";
  if (ok && msg) setTimeout(() => { if (s.textContent === msg) { s.textContent = ""; s.className = ""; } }, 4000);
}
const imgURL = p => "/file?path=" + encodeURIComponent(p);
const seconds = v => /^\d+$/.test(v) ? ` = ${(v / 60).toFixed(v % 60 ? 2 : 0)} s` : "";

let META = null, CG = null;
const TEXT_TYPES = new Set(["text"]);

/* ------------------------------------------------------------ tabs */
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.tab !== "scenes" && SC.dirty && !confirm("The scene has unsaved changes. Leave them for now?")) return;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + b.dataset.tab));
  if (b.dataset.tab === "cgs") loadCGs();
  if (b.dataset.tab === "opening") loadOpening();
}));
window.addEventListener("beforeunload", e => { if (SC.dirty) { e.preventDefault(); e.returnValue = ""; } });

function datalists() {
  for (const [t, names] of Object.entries(META.types)) {
    const dl = el("datalist", { id: "dl-" + t });
    names.forEach(n => dl.append(el("option", { value: n })));
    document.body.append(dl);
  }
  const dl = el("datalist", { id: "dl-bool" });
  ["TRUE", "FALSE"].forEach(n => dl.append(el("option", { value: n })));
  document.body.append(dl);
}

/* ------------------------------------------------------------ scenes */
const SC = { file: null, model: null, sel: null, dirty: false, textMode: false };

function blockLabel(b) {
  if (b.type === "script") return [b.name, b.comment || (b.control ? "station script (runs the scene)" : "")];
  if (b.type === "c") return ["C code", "#define / #include lines"];
  if (b.type === "stations" || b.type === "groups") return [b.type, "the scene layout"];
  return [b.type + " " + b.name, b.comment || (b.type === "sectors" ? "the scene layout" : "")];
}

async function loadScenes() {
  const files = await api("/api/scenes");
  SC.files = files;
  await openScene(SC.file || files[0]);
}

async function openScene(file, keepSel) {
  const r = await api("/api/scene?file=" + encodeURIComponent(file));
  SC.file = file; SC.text = r.text; SC.model = r.model; SC.dirty = false;
  if (!r.model) { SC.textMode = true; status(r.error, false); }
  if (!keepSel) SC.sel = SC.model ? SC.model.blocks.findIndex(b => b.type === "script") : null;
  renderSceneSide(); renderScenePane();
}

function setDirty() { SC.dirty = true; $("#save-btn") && ($("#save-btn").disabled = false); }

function renderSceneSide() {
  const side = $("#scene-side"); side.textContent = "";
  const pick = el("select", { onchange: async e => {
    if (SC.dirty && !confirm("Discard the unsaved changes?")) { e.target.value = SC.file; return; }
    SC.textMode = false; await openScene(e.target.value);
  } }, SC.files.map(f => el("option", { value: f, selected: f === SC.file, text: f })));
  side.append(el("div", { class: "hd", text: "Scene file" }), pick);
  if (!SC.model) return;
  let head = null;
  SC.model.blocks.forEach((b, i) => {
    if (b.type === "comment") {
      const t = b.text.trim();
      if (/^groups?\s+[\d, ]+—/.test(t)) head = t;
      return;
    }
    if (b.type === "blank") return;
    if (head) { side.append(el("div", { class: "hd", text: head })); head = null; }
    const [name, sub] = blockLabel(b);
    side.append(el("div", { class: "it" + (i === SC.sel ? " on" : ""), onclick: () => { SC.sel = i; SC.textMode = false; renderSceneSide(); renderScenePane(); } },
      name, sub ? el("small", { text: sub }) : null));
  });
  side.append(el("div", { style: "padding:8px 6px" }, el("button", { class: "b", text: "+ New script", onclick: newScript })));
}

function newScript() {
  const name = prompt("Name of the new script (letters, digits, _), e.g. g6_s0_lives1_dlg0:");
  if (!name) return;
  if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) return status("A name is letters, digits and _", false);
  if (SC.model.blocks.some(b => b.type === "script" && b.name === name)) return status("There is a script with that name", false);
  let at = SC.model.blocks.findIndex(b => ["actors", "objects", "stations", "sectors", "groups"].includes(b.type));
  if (at < 0) at = SC.model.blocks.length;
  const blk = { type: "script", name, rows: [{ type: "cmd", op: "DEBUGINFO", args: [] }, { type: "cmd", op: "HALT", args: [] }] };
  SC.model.blocks.splice(at, 0, blk, { type: "blank" });
  SC.sel = at; setDirty(); renderSceneSide(); renderScenePane();
  status("Added. An actor or object runs it when its line in actors/objects says script=" + name);
}

function renderScenePane() {
  const pane = $("#scene-pane"); pane.textContent = "";
  const bar = el("div", { class: "toolbar" },
    el("button", { class: "b primary", id: "save-btn", text: "Save", disabled: !SC.dirty, onclick: saveScene }),
    el("button", { class: "b", text: "Revert", onclick: async () => { if (!SC.dirty || confirm("Discard the unsaved changes?")) await openScene(SC.file, true); } }),
    el("span", { class: "sp" }),
    el("button", { class: "b", text: SC.textMode ? "Back to the list view" : "Edit as text", onclick: () => {
      if (!SC.textMode && SC.dirty) return status("Save first, then edit as text", false);
      SC.textMode = !SC.textMode; renderScenePane(); } }));
  pane.append(bar);
  if (SC.textMode) {
    const ta = el("textarea", { class: "mono", rows: 40, spellcheck: "false", oninput: setDirty });
    ta.value = SC.text;
    pane.append(el("p", { class: "muted", text: "The whole file as text: one command a line, # starts a comment. Save checks it first." }), ta);
    SC.textArea = ta;
    return;
  }
  SC.textArea = null;
  const b = SC.model && SC.model.blocks[SC.sel];
  if (!b) { pane.append(el("p", { class: "muted", text: "Pick a script on the left." })); return; }
  if (b.type === "script") renderScript(pane, b);
  else if (b.type === "c") {
    const ta = el("textarea", { class: "mono", rows: Math.max(4, b.lines.length + 1), oninput: e => { b.lines = e.target.value.split("\n"); setDirty(); } });
    ta.value = b.lines.join("\n");
    pane.append(el("h2", { text: "C code (copied into the build as it is)" }), ta);
  } else renderTable(pane, b);
}

const FIELDS = {
  actor: ["kind", "facing", "x", "y", "w", "h", "script", "script1", "script2", "script3", "xflags", "yflags"],
  object: ["kind", "facing", "x", "y", "w", "h", "script", "script1", "script2", "script3", "xflags", "yflags"],
  sector: ["actors", "objects", "effects", "events", "station"],
  station: ["name"], group: ["name"],
};
const ROWTYPE = { actors: "actor", objects: "object", sectors: "sector", stations: "station", groups: "group" };
const TABLE_HELP = {
  actors: "The Pokémon on the map. kind: 0 = the hero, 34 = the partner, or a SKY_LIVES_ name. x, y: the tile (22.5 = half a tile down). facing: SOUTH, EAST, NORTH, WEST... script: the script it runs.",
  objects: "Objects on the map (the Relic Fragment, the totem poles). Same fields as actors; w, h: the size in tiles.",
  stations: "The station scripts, by number: a sector's station=N runs the Nth (from 0).",
  sectors: "A group's sectors: what SELECT_ENTITIES / SELECT_LIVES / SELECT_OBJECTS put on the map (sector 0 when the scene starts).",
  groups: "The groups of this map, in order: group N is the Nth line.",
};

function renderTable(pane, b) {
  pane.append(el("h2", { text: blockLabel(b)[0] }), el("p", { class: "muted", text: TABLE_HELP[b.type] || "" }));
  const rt = ROWTYPE[b.type];
  b.rows.forEach((r, k) => {
    if (r.type !== rt) return;
    const line = el("div", { class: "fieldrow" });
    for (const f of FIELDS[rt]) {
      const inp = el("input", { value: r[f] ?? "", list: f === "facing" ? "dl-facing" : null, oninput: e => {
        if (e.target.value === "") delete r[f]; else r[f] = e.target.value; setDirty(); } });
      line.append(el("label", {}, f, inp));
    }
    line.append(el("button", { class: "i", title: "Remove this line", text: "✕", onclick: () => { b.rows.splice(k, 1); setDirty(); renderScenePane(); } }));
    pane.append(line);
  });
  pane.append(el("div", { style: "margin-top:8px" }, el("button", { class: "b", text: "+ Add a line", onclick: () => {
    const r = { type: rt };
    if (rt === "actor" || rt === "object") Object.assign(r, { kind: "0", x: "0", y: "0" });
    if (rt === "station" || rt === "group") r.name = "";
    b.rows.push(r); setDirty(); renderScenePane(); } })));
}

function cmdOptions(sel) {
  const s = el("select");
  for (const cat of META.cats) {
    const g = el("optgroup", { label: cat });
    Object.values(META.commands).filter(c => c.cat === cat).sort((a, b) => a.name.localeCompare(b.name))
      .forEach(c => g.append(el("option", { value: c.name, selected: c.name === sel, text: c.name })));
    s.append(g);
  }
  return s;
}

function cgThumb(name) {
  if (!CG) return null;
  const c = CG.cgs.find(c => c.name === name) || CG.pans.find(p => p.name === name);
  const p = c && (c.picture || c.preview);
  return p ? el("img", { class: "thumb", src: imgURL(p), alt: name }) : null;
}

function renderScript(pane, b) {
  pane.append(el("h2", {}, "script ", el("span", { class: "mono", text: b.name })));
  const info = el("div", { class: "kv", style: "margin-bottom:8px" });
  const note = el("input", { value: b.comment ?? "", oninput: e => { b.comment = e.target.value || undefined; if (!e.target.value) delete b.comment; setDirty(); renderSceneSide(); } });
  info.append(el("span", { class: "muted", text: "Note" }), note);
  if (b.control) info.append(el("span", { class: "muted", text: "Station script" }), el("span", { class: "mono", text: `control=${b.control} type=${b.stype}` }));
  pane.append(info);
  const rows = el("div", { class: "rows" });
  b.rows.forEach((r, k) => rows.append(renderRow(b, r, k)));
  pane.append(rows);
  pane.append(el("div", { class: "toolbar", style: "margin-top:8px" },
    el("button", { class: "b", text: "+ Command", onclick: () => insertRow(b, b.rows.length, "cmd") }),
    el("button", { class: "b", text: "+ Comment", onclick: () => insertRow(b, b.rows.length, "comment") })));
}

function insertRow(b, at, kind) {
  const r = kind === "comment" ? { type: "comment", text: "" } : kind === "blank" ? { type: "blank" } : { type: "cmd", op: "WAIT", args: ["30"] };
  b.rows.splice(at, 0, r); setDirty(); renderScenePane();
}

function moveRow(b, k, d) {
  const j = k + d;
  if (j < 0 || j >= b.rows.length) return;
  [b.rows[k], b.rows[j]] = [b.rows[j], b.rows[k]]; setDirty(); renderScenePane();
}

function renderRow(b, r, k) {
  const tools = el("div", {},
    el("button", { class: "i", title: "Move up", text: "▲", onclick: () => moveRow(b, k, -1) }),
    el("button", { class: "i", title: "Move down", text: "▼", onclick: () => moveRow(b, k, 1) }));
  const end = el("div", {},
    el("button", { class: "i", title: "Insert a command below", text: "+", onclick: () => insertRow(b, k + 1, "cmd") }),
    el("button", { class: "i", title: "Delete this line", text: "✕", onclick: () => { b.rows.splice(k, 1); setDirty(); renderScenePane(); } }));
  const n = el("div", { class: "n", text: String(k + 1) });
  if (r.type === "blank") return el("div", { class: "row blank" }, n, tools, el("div", { class: "c", text: "(empty line)" }), end);
  if (r.type === "comment") {
    const inp = el("input", { value: r.text, placeholder: "a comment", oninput: e => { r.text = e.target.value; setDirty(); } });
    return el("div", { class: "row comment" }, n, tools, el("div", { class: "c" }, el("span", { class: "muted", text: "# " }), inp), end);
  }
  const spec = META.commands[r.op] || { args: [], help: "" };
  const sel = cmdOptions(r.op);
  sel.title = spec.help;
  sel.addEventListener("change", e => {
    const ns = META.commands[e.target.value];
    const old = Object.fromEntries(spec.args.map((a, i) => [a.name, r.args[i]]));
    r.op = ns.name;
    r.args = ns.args.map(a => old[a.name] ?? (a.type === "bool" ? "TRUE" : a.type === "text" ? "" : a.type === "npc" ? "-1" : "0"));
    if (r.op === "DEBUGINFO") r.args = [];
    setDirty(); renderScenePane();
  });
  const cmdCell = el("div", {}, sel, el("div", { class: "help", text: spec.help }));
  const args = el("div", { class: "args" });
  spec.args.forEach((a, i) => {
    if (r.op === "DEBUGINFO") {
      args.append(el("span", { class: "muted", text: r.args.length ? `debug marker (line ${r.args[0]})` : "debug marker" }));
      return;
    }

async function saveScene() {
  const body = SC.textMode ? { file: SC.file, text: SC.textArea.value } : { file: SC.file, model: SC.model };
  const r = await api("/api/scene/save", body);
  if (!r.ok) return status("Not saved: " + r.error, false);
  SC.model = r.model; SC.text = r.text; SC.dirty = false;
  status("Saved " + SC.file + ". Build the ROM to see it in the game.");

/* ------------------------------------------------------------ story CGs */

async function upload(file) {

      el("td", {}, moved || s.first != s.rec_first || s.last != s.rec_last || s.play !== "yes" ? el("button", { class: "b", text: "As recorded", onclick: () =>

/* ------------------------------------------------------------ build */
$("#build-btn").addEventListener("click", async e => {
  if (SC.dirty && !confirm("The scene has unsaved changes; build without them?")) return;
  e.target.disabled = true; const log = $("#build-log"); log.hidden = false; log.textContent = "Building… (the first build takes several minutes)";
  const r = await api("/api/build", {});
  e.target.disabled = false; log.textContent = r.log;
  status(r.ok ? "Built pmd_red.gba" : "The build failed: see the log", r.ok);
});

(async () => {
  META = await api("/api/meta");
  datalists();
  const dl = el("datalist", { id: "dl-facing" }); META.facings.forEach(f => dl.append(el("option", { value: f }))); document.body.append(dl);
  CG = await api("/api/cutaways");
  /* #tab=cgs | #file=X.scene&script=NAME: open there */
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("file")) SC.file = h.get("file");
  await loadScenes();
  if (h.get("script")) {
    const i = SC.model.blocks.findIndex(b => b.name === h.get("script"));
    if (i >= 0) { SC.sel = i; renderSceneSide(); renderScenePane(); }
  }
  if (h.get("tab")) document.querySelector(`nav button[data-tab="${h.get("tab")}"]`)?.click();
})();
