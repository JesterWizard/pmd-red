name: GithubCI

on:
  push:
    branches: [ master ]
  pull_request:

env:
  CALCROM_DISCORD_WEBHOOK_USERNAME: ${{ secrets.CALCROM_DISCORD_WEBHOOK_USERNAME }}
  CALCROM_DISCORD_WEBHOOK_AVATAR_URL:  ${{ secrets.CALCROM_DISCORD_WEBHOOK_AVATAR_URL }}
  CALCROM_DISCORD_WEBHOOK_URL:  ${{ secrets.CALCROM_DISCORD_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      # Same setup as cloud sessions: apt packages, the Python modules the
      # build imports, baserom.gba from baserom.xdelta, and `make tools`.
      # agbcc is not installed: `make MODERN=0` is not a gate on this branch.
      - name: Install toolchain, Python modules and baserom
        run: scripts/cloud/setup.sh

      # The only build gate is `make` (modern hack build). Do not run
      # `make compare`: the hack ROM cannot match the retail sha1 in red.sha1.
      - name: Build pmd_red.gba
        run: make -j"$(nproc)"

      # only run OK when pushed to master
      - name: Run OK webhook
        shell: bash
        if: ${{ github.event_name == 'push' }}
        run: |
          sudo chmod 755 $GITHUB_WORKSPACE/.github/calcrom/webhook.sh
          $GITHUB_WORKSPACE/.github/calcrom/webhook.sh pmd_red "$CALCROM_DISCORD_WEBHOOK_URL"
        continue-on-error: true
