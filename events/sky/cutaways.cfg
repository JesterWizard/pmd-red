# Story CGs ("cutaways"): the full-screen pictures the chapter-1 scenes show.
#
# A scene shows one with `SKY_CUTAWAY cg=NAME frames=N` (events/sky/scenes/).
# How long it stays up is that line's frames (60 frames = 1 second), so the
# same picture can be shown for different times in different scenes. This
# file says which picture each CG is and how pictures fade and pan.
#
# Open it in the event editor (python3 tools/event_editor/serve.py) or edit it
# by hand; the build reads it. See documentation/EventEditor.md.
# Nothing here needs the Explorers of Sky ROM.

# ---------------------------------------------------------------- still pictures

[stills]
fade_frames = 32        # frames each fade in / out takes: 32, 64, 96, ...
skip_after = 30         # A or B skips a still picture after this many frames

# A still CG is a 240x160 PNG. To show another picture, point picture at a
# new PNG file (any size: it is scaled to fill the screen, up to 240 colours).
# Add a CG with a new [cg NAME] section; scenes then use cg=NAME.
# id is the CG's number in the game and never changes: a new CG takes the
# next number no CG has had (20, 21, ...); 2 and 3 were the storm cliff's.

[cg SKY_DAY]
id = 0
title = The daytime sky (EoS v01p03a)
picture = graphics/custom/sky_cutaways/sky_day.png

[cg SKY_DUSK]
id = 1
title = The sky at dusk (EoS v01p03b)
picture = graphics/custom/sky_cutaways/sky_dusk.png

[cg GUILD_SKY]
id = 4
title = Clouds over Wigglytuff's Guild (EoS v02p01a)
picture = graphics/custom/sky_cutaways/guild_sky.png

