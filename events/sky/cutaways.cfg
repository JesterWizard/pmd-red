# ---------------------------------------------------------------- animations

[sequence SUNSET_SEA_ANIM]
title = The sea glittering at sunset (m01a0205): SUNSET_SEA0..7 in a loop
frames_per_picture = 8  # each of the eight pictures stays this many frames

# ---------------------------------------------------------------- pans
#
# A pan is a tall picture: EoS's top-screen CG over the scene's map (EoS
# shows them on its two screens). The scene's `frames` is how long the
# picture is held before it moves.
#   direction = down   from the CG down to the scene; it ends exactly on the
#                      scene's first view, so the scene goes on without a cut
#             = up     from the scene up to the CG, then a fade to black
#             = none   the CG only, then a fade to black
#   speed     = pixels a second (the pan moves the picture's height less 160)
#   easing    = smooth (starts and ends slowly) or linear (one speed)
#   fade_in   = yes: fade in from black; no: appear at once
#   top       = the CG at the top of the picture. After changing it run
#               `python3 tools/event_editor/cutaways.py pans` (or the editor's
#               "Rebuild pan pictures") to make the tall picture again.
#   preview   = the tall picture as the GBA shows it (made by that command)

[pan SKY_DAY_SCROLL]
title = The sky over the beach, down to the hero on the sand (m01a0103)
top = graphics/custom/sky_cutaways/sky_day.png
preview = graphics/custom/sky_scrolls/beach_check.png
direction = down
speed = 100
easing = smooth
fade_in = yes

[pan GUILD_SKY_SCROLL]
title = Clouds over the guild, down to the partner at the gate (m01a0104)
top = graphics/custom/sky_cutaways/guild_sky.png
preview = graphics/custom/sky_scrolls/guild_check.png
direction = down
speed = 100
easing = smooth
fade_in = yes

