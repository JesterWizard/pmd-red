# EoS's opening movie (power-on, before the title): the Shaymin scene, then
# thirteen scenes recorded from Explorers of Sky (fourteen here: the logo
# scene is shown in two parts). 60 frames = 1 second.
#
# Open it in the event editor (python3 tools/event_editor/serve.py) or edit it
# by hand; the build reads it. See documentation/EventEditor.md.

# ---------------------------------------------------------------- Shaymin
#
# The first scene: the sky with the sun and the lens flare, a flash, then the
# camera moves down the picture to the land while Shaymin flies past. Frames
# count from the start of the fade in. All of it can be changed without the
# EoS ROM.

[shaymin]
fade_in = 16            # frames of the fade in from black
white_start = 34        # the frame the sky starts to white out (the flash)
white_frames = 16       # frames to white, and as many back
flare = 74              # the frame the lens flare starts to move
pan_start = 80          # the frame the camera starts to move down
pan_join = 200          # the frame the camera reaches the land (eased from pan_start)
pan_end = 376           # the frame the camera stops
pan_speed = 2           # after pan_join the camera moves 1/pan_speed pixels a frame
land_view = 208         # the picture line at the top of the screen at pan_join
shaymin = 215           # the frame Shaymin appears (it flies for 99 frames)
petals = 290            # the frame the petals appear
fade_out = 387          # the frame the fade out starts
fade_out_frames = 60    # frames of the fade out
skip_fade_frames = 30   # frames of the fade out when START skips the opening

# ---------------------------------------------------------------- recorded scenes
#
# Each scene is recorded frame by frame from EoS. The DS shows 256x384 (two
# screens); the GBA shows 240x160 of it, the "view".
#
#   play  = yes / no       no leaves the scene out
#   first, last            the recorded frames to play (0 = the scene's first);
#                          fewer is fine, more needs the EoS ROM
#   view  = frame:x,y ...  where the view is (its top-left corner on the DS's
#                          two screens, the top screen at y 0-191, the bottom
#                          one at 192-383) at those frames; it moves between them
#   ease  = smooth         starts and ends a move slowly; linear: one speed
#
# A scene starts when the song reaches the point EoS starts it at, so a shorter
# scene leaves the screen as it was until the next one. Moving the view without
# the EoS ROM moves the pictures that were recorded: sprites that were outside
# the recorded view are not there. With the ROM, `tools/make_sky_opening.py
# EOS.nds` records the scenes again with these settings and makes them exact.

[scene lapras]
title = Lapras on the sea, the camera rises to the Wingull
play = yes
first = 0
last = 288
view = 0:8,116  23:8,116  207:8,236  288:8,236
ease = linear

